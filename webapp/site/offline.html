<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · SellFlow</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #F4F6FB; color: #27364F;
    }
    .card {
      text-align: center; max-width: 420px; padding: 48px 36px;
      background: #fff; border: 1px solid #E4E9F2; border-radius: 18px;
      box-shadow: 0 18px 48px -18px rgba(14, 27, 46, .32);
      margin: 0 20px;
    }
    .mark { width: 52px; height: 52px; border-radius: 15px; background: linear-gradient(135deg, #18C6B3, #0E8F84); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 22px; }
    h1 { margin: 0 0 10px; font-size: 22px; color: #0E1B2E; letter-spacing: -.02em; }
    p { margin: 0 0 26px; font-size: 14px; line-height: 1.6; color: #5B6B84; }
    a.button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 22px; border-radius: 10px;
      background: #0B7E74; color: #fff; font-weight: 650; font-size: 14px;
      text-decoration: none;
    }
    a.button:hover { background: #0E988C; }
  </style>
</head>
<body>
  <main class="card">
    <span class="mark" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="none"/><path d="M10 21c0-3.2 2.6-4.4 6-5s6-1.4 6-4.4C22 9.2 19.4 8 16 8s-6 1.2-6 3.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M22 11c0 3.2-2.6 4.4-6 5s-6 1.4-6 4.4C10 22.8 12.6 24 16 24s6-1.2 6-3.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".55"/></svg>
    </span>
    <h1>You're offline</h1>
    <p>SellFlow needs a connection for orders and payments. Reconnect and try again — your session is safe.</p>
    <a class="button" href="/">Try again</a>
  </main>
</body>
</html>
