services:
  - type: web
    name: sellflow-api
    env: python
    pythonVersion: 3.13
    region: oregon
    plan: starter
    buildCommand: |
      chmod +x build.sh
      ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RENDER_PYTHON_VERSION
        value: "3.13"
      - key: PYO3_USE_ABI3_FORWARD_COMPATIBILITY
        value: "1"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
    healthCheckPath: /health
    disk:
      name: sellflow-data
      mountPath: /opt/render/.data
